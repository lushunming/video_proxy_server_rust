[package]
name = "video_proxy_server_rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "video_proxy_server_rust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }

regex = "1"
lazy_static = "1.4"
dashmap = "5" # 高性能并发线程安全 Map，替代 Go 的 sync.Map
bytes = "1"
futures-util = "0.3"

axum = "0.7"
async-stream = "0.3"

[profile.release]
opt-level = "z"      # 最小体积优化
lto = true           # 全程序优化
strip = true         # 去除调试符号
panic = "abort"      # 禁用 unwind，减小体积
codegen-units = 1    # 更好的优化


